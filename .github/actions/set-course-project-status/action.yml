name: Set course Project status
description: Update the linked GitHub Course Project item for one repository Issue.

inputs:
  token:
    description: Token with Projects write access.
    required: true
  issue-number:
    description: Repository Issue number represented by the Project item.
    required: true
  target-status:
    description: Target Status option name, for example In progress, Review, Done or Ready.
    required: true
  allowed-current-statuses:
    description: Optional comma-separated current Status names allowed before the update.
    required: false
  no-op-current-statuses:
    description: Optional comma-separated current Status names that should leave Project state unchanged and succeed.
    required: false
  add-if-missing:
    description: Add the repository Issue to the Project before setting Status when it is not already an item.
    required: false
    default: "false"
  allow-missing:
    description: Treat an Issue that is not on the Project as a successful no-op.
    required: false
    default: "false"

outputs:
  previous-status:
    description: Status observed before the update.
    value: ${{ steps.set.outputs.previous-status }}

runs:
  using: composite
  steps:
    - id: set
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        TARGET_STATUS: ${{ inputs.target-status }}
        ALLOWED_CURRENT_STATUSES: ${{ inputs.allowed-current-statuses }}
        NO_OP_CURRENT_STATUSES: ${{ inputs.no-op-current-statuses }}
        ADD_IF_MISSING: ${{ inputs.add-if-missing }}
        ALLOW_MISSING: ${{ inputs.allow-missing }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/transition-policy.sh"
        source "$GITHUB_ACTION_PATH/project-items.sh"

        query='query($number: Int!) { user(login: "tbhrc") { projectV2(number: 1) { id fields(first: 50) { nodes { ... on ProjectV2SingleSelectField { id name options { id name } } } } } } repository(owner: "tbhrc", name: "github-course") { issue(number: $number) { id } } }'
        data_json="$(gh api graphql -f query="$query" -F number="$ISSUE_NUMBER" --jq '.data')"
        project_json="$(jq -c '.user.projectV2' <<<"$data_json")"

        if [ -z "$project_json" ] || [ "$project_json" = "null" ]; then
          echo "Unable to read user Project #1. Check PROJECT_MANAGEMENT_TOKEN permissions." >&2
          exit 1
        fi

        project_id="$(jq -r '.id' <<<"$project_json")"
        issue_node_id="$(jq -r '.repository.issue.id // empty' <<<"$data_json")"
        status_field_id="$(jq -r '.fields.nodes[] | select(.name == "Status") | .id' <<<"$project_json" | head -n1)"
        option_id="$(jq -r --arg target "$TARGET_STATUS" '.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == $target) | .id' <<<"$project_json" | head -n1)"
        item_json="$(find_course_project_item "$ISSUE_NUMBER")"

        if [ -z "$status_field_id" ] || [ -z "$option_id" ]; then
          echo "Project Status field or target option '${TARGET_STATUS}' was not found." >&2
          exit 1
        fi

        if [ -z "$item_json" ]; then
          if [ "$ADD_IF_MISSING" = "true" ]; then
            if [ -z "$issue_node_id" ]; then
              echo "Repository Issue #${ISSUE_NUMBER} was not found." >&2
              exit 1
            fi
            add_mutation='mutation($projectId: ID!, $contentId: ID!) { addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) { item { id } } }'
            item_id="$(gh api graphql -f query="$add_mutation" -f projectId="$project_id" -f contentId="$issue_node_id" --jq '.data.addProjectV2ItemById.item.id')"
            previous_status=""
            echo "Issue #${ISSUE_NUMBER} added to GitHub Course — Execution & Mastery."
          elif [ "$ALLOW_MISSING" = "true" ]; then
            echo "previous-status=" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Issue #${ISSUE_NUMBER} is not an item in GitHub Course — Execution & Mastery." >&2
            exit 1
          fi
        else
          item_id="$(jq -r '.id' <<<"$item_json")"
          previous_status="$(jq -r '.fieldValueByName.name // ""' <<<"$item_json")"
        fi

        echo "previous-status=$previous_status" >> "$GITHUB_OUTPUT"
        decision="$(project_status_decision "$previous_status" "$TARGET_STATUS" "$ALLOWED_CURRENT_STATUSES" "$NO_OP_CURRENT_STATUSES")"

        case "$decision" in
          already)
            echo "Issue #${ISSUE_NUMBER} already correct: Project Status is ${TARGET_STATUS}."
            exit 0
            ;;
          ignore)
            echo "Issue #${ISSUE_NUMBER} ignored because current Project Status '${previous_status}' is later/terminal for requested '${TARGET_STATUS}'."
            exit 0
            ;;
          reject)
            echo "Issue #${ISSUE_NUMBER} current Project Status '${previous_status:-unset}' is not allowed for transition to '${TARGET_STATUS}'." >&2
            exit 1
            ;;
          transition)
            ;;
          *)
            echo "Unexpected Project Status transition decision '${decision}'." >&2
            exit 1
            ;;
        esac

        mutation='mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) { updateProjectV2ItemFieldValue(input: {projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: {singleSelectOptionId: $optionId}}) { projectV2Item { id } } }'
        gh api graphql -f query="$mutation" -f projectId="$project_id" -f itemId="$item_id" -f fieldId="$status_field_id" -f optionId="$option_id" >/dev/null
        echo "Issue #${ISSUE_NUMBER} transitioned: ${previous_status:-unset} -> ${TARGET_STATUS}"
