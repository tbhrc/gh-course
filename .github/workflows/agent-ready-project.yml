name: Synchronise native agent work with Project

on:
  issues:
    types: [assigned, closed, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  agent-assigned:
    if: github.event_name == 'issues' && github.event.action == 'assigned' && (github.event.assignee.login == 'Copilot' || github.event.assignee.login == 'Codex' || github.event.assignee.login == 'Claude')
    runs-on: ubuntu-latest
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Mark native agent work In progress
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: In progress
          allowed-current-statuses: Ready,Backlog

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set Review on each linked Issue
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[].number' | while read -r issue; do
            [ -z "$issue" ] && continue
            echo "issue=$issue" >> "$GITHUB_OUTPUT"
          done
      - name: Mark linked Issue Review
        if: env.PROJECT_MANAGEMENT_TOKEN != '' && steps.linked.outputs.issue != ''
        id: linked-review
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ steps.linked.outputs.issue }}
          target-status: Review
          allowed-current-statuses: In progress,Ready
          allow-missing: "true"

  done:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Mark closed Project Issue Done
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: Done
          allow-missing: "true"

  reopened:
    if: github.event_name == 'issues' && github.event.action == 'reopened'
    runs-on: ubuntu-latest
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Return reopened Project Issue to Ready
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: Ready
          allow-missing: "true"
