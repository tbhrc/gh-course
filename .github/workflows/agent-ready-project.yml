name: Synchronise Issue lifecycle with Project

on:
  issues:
    types: [opened, assigned, closed, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review]
  push:
    branches:
      - 'issue-*'

permissions:
  contents: read
  pull-requests: read

jobs:
  intake:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add new Issue to Project Ready
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: Ready
          add-if-missing: "true"

  web-direct-start:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate branch-start transition policy
        shell: bash
        run: bash .github/actions/set-course-project-status/test-transition-policy.sh
      - name: Resolve Issue number from issue-linked branch
        id: linked
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" =~ ^issue-([0-9]+)(-|$) ]]; then
            echo "issue=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "issue=" >> "$GITHUB_OUTPUT"
          fi
      - name: Mark Web-direct work In progress
        if: env.PROJECT_MANAGEMENT_TOKEN != '' && steps.linked.outputs.issue != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ steps.linked.outputs.issue }}
          target-status: In progress
          allowed-current-statuses: Backlog,Ready
          no-op-current-statuses: Review,Blocked,Done
          add-if-missing: "true"

  agent-assigned:
    if: github.event_name == 'issues' && github.event.action == 'assigned' && (github.event.assignee.login == 'Copilot' || github.event.assignee.login == 'Codex' || github.event.assignee.login == 'Claude')
    runs-on: ubuntu-latest
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark native agent work In progress
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: In progress
          allowed-current-statuses: Ready,Backlog
          add-if-missing: "true"

  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find linked Issue
        id: linked
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issue="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
      - name: Mark linked Issue Review
        if: env.PROJECT_MANAGEMENT_TOKEN != '' && steps.linked.outputs.issue != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ steps.linked.outputs.issue }}
          target-status: Review
          allowed-current-statuses: In progress,Ready,Backlog
          add-if-missing: "true"

  done:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark closed Project Issue Done
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: Done
          add-if-missing: "true"

  reopened:
    if: github.event_name == 'issues' && github.event.action == 'reopened'
    runs-on: ubuntu-latest
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Return reopened Project Issue to Ready
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          target-status: Ready
          add-if-missing: "true"
