name: Synchronise Issue lifecycle with Project

on:
  issues:
    types: [opened, assigned, closed, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review]
  push:
    branches:
      - 'issue-*'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  resolve_work_item:
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.resolve.outputs.issue }}
    steps:
      - name: Resolve canonical Issue number
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue=""
          case "$EVENT_NAME" in
            issues)
              issue="$EVENT_ISSUE_NUMBER"
              ;;
            push)
              if [[ "$REF_NAME" =~ ^issue-([0-9]+)(-|$) ]]; then
                issue="${BASH_REMATCH[1]}"
              fi
              ;;
            pull_request)
              issue="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')"
              ;;
          esac
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

  intake:
    needs: resolve_work_item
    if: github.event_name == 'issues' && github.event.action == 'opened' && needs.resolve_work_item.outputs.issue != ''
    runs-on: ubuntu-latest
    concurrency:
      group: course-project-lifecycle-${{ needs.resolve_work_item.outputs.issue }}
      queue: max
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add new Issue to Project Ready
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ needs.resolve_work_item.outputs.issue }}
          target-status: Ready
          add-if-missing: "true"

  web-direct-start:
    needs: resolve_work_item
    if: github.event_name == 'push' && needs.resolve_work_item.outputs.issue != ''
    runs-on: ubuntu-latest
    concurrency:
      group: course-project-lifecycle-${{ needs.resolve_work_item.outputs.issue }}
      queue: max
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Project lifecycle helpers
        shell: bash
        run: |
          bash .github/actions/set-course-project-status/test-transition-policy.sh
          bash .github/actions/set-course-project-status/test-project-items-pagination.sh
      - name: Mark Web-direct work In progress
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ needs.resolve_work_item.outputs.issue }}
          target-status: In progress
          allowed-current-statuses: Backlog,Ready
          no-op-current-statuses: Review,Blocked,Done
          add-if-missing: "true"

  agent-assigned:
    needs: resolve_work_item
    if: github.event_name == 'issues' && github.event.action == 'assigned' && needs.resolve_work_item.outputs.issue != '' && (github.event.assignee.login == 'Copilot' || github.event.assignee.login == 'Codex' || github.event.assignee.login == 'Claude')
    runs-on: ubuntu-latest
    concurrency:
      group: course-project-lifecycle-${{ needs.resolve_work_item.outputs.issue }}
      queue: max
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark native agent work In progress
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ needs.resolve_work_item.outputs.issue }}
          target-status: In progress
          allowed-current-statuses: Ready,Backlog
          add-if-missing: "true"

  review:
    needs: resolve_work_item
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.resolve_work_item.outputs.issue != ''
    runs-on: ubuntu-latest
    concurrency:
      group: course-project-lifecycle-${{ needs.resolve_work_item.outputs.issue }}
      queue: max
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark linked Issue Review
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ needs.resolve_work_item.outputs.issue }}
          target-status: Review
          allowed-current-statuses: In progress,Ready,Backlog
          add-if-missing: "true"

  done:
    needs: resolve_work_item
    if: github.event_name == 'issues' && github.event.action == 'closed' && needs.resolve_work_item.outputs.issue != ''
    runs-on: ubuntu-latest
    concurrency:
      group: course-project-lifecycle-${{ needs.resolve_work_item.outputs.issue }}
      queue: max
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark closed Project Issue Done
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ needs.resolve_work_item.outputs.issue }}
          target-status: Done
          add-if-missing: "true"

  reopened:
    needs: resolve_work_item
    if: github.event_name == 'issues' && github.event.action == 'reopened' && needs.resolve_work_item.outputs.issue != ''
    runs-on: ubuntu-latest
    concurrency:
      group: course-project-lifecycle-${{ needs.resolve_work_item.outputs.issue }}
      queue: max
    env:
      PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Return reopened Project Issue to Ready
        if: env.PROJECT_MANAGEMENT_TOKEN != ''
        uses: ./.github/actions/set-course-project-status
        with:
          token: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
          issue-number: ${{ needs.resolve_work_item.outputs.issue }}
          target-status: Ready
          add-if-missing: "true"
