name: Copilot Free AI Smoke Test

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: github.actor == 'tbhrc' && startsWith(github.event.issue.title, '[copilot-free-ai]')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Build bounded prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' 'You are running as a GitHub Copilot CLI smoke test inside GitHub Actions.'
            printf '%s\n' 'Do not use tools, edit files, run commands, access the web, or request more input.'
            printf '%s\n' 'Use only the context supplied below.'
            printf '%s\n' 'Return a concise analysis with exactly these headings:'
            printf '%s\n' '1. Repository purpose'
            printf '%s\n' '2. Issue objective'
            printf '%s\n' '3. Deterministic vs agentic distinction'
            printf '%s\n' '4. Evidence sentence'
            printf '%s\n' 'Under Evidence sentence, explicitly state that this text was generated by Copilot AI inference inside a GitHub Actions run, not by deterministic shell logic.'
            printf '\n--- TRIGGERING ISSUE ---\n'
            printf 'Title: %s\n\n' "$ISSUE_TITLE"
            printf '%s\n' "$ISSUE_BODY"
            printf '\n--- VERSION ---\n'
            cat VERSION
            printf '\n--- AGENTS.md EXCERPT ---\n'
            sed -n '1,180p' AGENTS.md
            printf '\n--- README.md EXCERPT ---\n'
            sed -n '1,220p' README.md
          } > /tmp/copilot-prompt.txt

      - name: Run Copilot AI inference
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.AGENT_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          copilot -p "$(cat /tmp/copilot-prompt.txt)" -s --no-ask-user > /tmp/copilot-response.txt
          test -s /tmp/copilot-response.txt
          cat /tmp/copilot-response.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Post AI response to Issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' '## Copilot Free AI smoke-test result'
            cat /tmp/copilot-response.txt
            printf '\n\n%s\n' '---'
            printf '%s\n' 'Provenance: deterministic GitHub Actions triggered and posted this comment; the analysis above is the captured output of the GitHub Copilot CLI inference step.'
          } > /tmp/issue-comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-comment.md
