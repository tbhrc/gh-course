name: Generate Public Site State

on:
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'wiki/Home.md'
      - 'students/david/progress.md'
      - 'knowledge-base/executor-benchmark-framework.md'
      - 'scripts/build_public_state.py'
      - 'site/index.template.html'
      - 'site/cms.js'
      - 'site/public-state.json'
      - 'index.html'
      - '.github/workflows/generate-public-site.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: generate-public-site
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build public CMS state and Pages shell
        run: |
          set -euo pipefail
          python3 scripts/build_public_state.py
          cp site/index.template.html index.html

      - name: Commit generated artifacts when changed
        id: generated
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html site/public-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated public artifacts already match canonical sources."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html site/public-state.json
          git commit -m "build: project canonical course state to public Pages"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request Pages build for generated commit
        if: steps.generated.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
