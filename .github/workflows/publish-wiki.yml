name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - 'students/david/progress.md'
      - 'knowledge-base/executor-benchmark-framework.md'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out course repository
        uses: actions/checkout@v4

      - name: Publish governed and generated Wiki surfaces
        env:
          WIKI_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: |
          set -euo pipefail

          git clone "$WIKI_URL" wiki-repo

          find wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          # Stable reader-facing narrative is governed under wiki/.
          cp wiki/*.md wiki-repo/

          # Volatile student state is generated from canonical learner truth.
          {
            echo '# Student Dashboard — David'
            echo
            echo '> **Generated live view.** This page is rebuilt automatically from `students/david/progress.md`. Do not maintain a separate current-state copy in the Wiki.'
            echo
            echo '[Open canonical learner evidence →](https://github.com/tbhrc/github-course/blob/main/students/david/progress.md)'
            echo
            tail -n +2 students/david/progress.md
          } > wiki-repo/Student-Dashboard-David.md

          # Volatile benchmark state is generated from the canonical benchmark file.
          {
            echo '# AI Executor Benchmark & Leaderboard'
            echo
            echo '> **Generated live view.** This page is rebuilt automatically from `knowledge-base/executor-benchmark-framework.md`. Issue bodies are evidence/history, not the current matrix.'
            echo
            echo '[Open canonical benchmark source →](https://github.com/tbhrc/github-course/blob/main/knowledge-base/executor-benchmark-framework.md)'
            echo
            tail -n +2 knowledge-base/executor-benchmark-framework.md
          } > wiki-repo/AI-Executor-Benchmark.md

          git -C wiki-repo config user.name "github-actions[bot]"
          git -C wiki-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C wiki-repo add -A

          if git -C wiki-repo diff --cached --quiet; then
            echo "Wiki already matches governed/generated sources."
            exit 0
          fi

          git -C wiki-repo commit -m "Publish course Wiki from ${GITHUB_SHA::7}"
          git -C wiki-repo push origin HEAD
