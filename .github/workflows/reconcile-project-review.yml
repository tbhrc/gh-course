name: Reconcile Project Review Status

on:
  push:
    branches:
      - issue-109-standardise-project-review
    paths:
      - '.github/workflows/reconcile-project-review.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
    steps:
      - name: Reconcile Testing to Review
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PROJECT_MANAGEMENT_TOKEN is not configured." >&2
            exit 1
          fi

          query='query { user(login: "tbhrc") { projectV2(number: 1) { fields(first: 50) { nodes { ... on ProjectV2SingleSelectField { id name options { id name color description } } } } } } }'
          status_json="$(gh api graphql -f query="$query" --jq '.data.user.projectV2.fields.nodes[] | select(.name == "Status")')"

          if [ -z "$status_json" ]; then
            echo "Project Status field not found." >&2
            exit 1
          fi

          field_id="$(jq -r '.id' <<<"$status_json")"
          before="$(jq -r '[.options[].name] | join(" / ")' <<<"$status_json")"
          review_count="$(jq '[.options[] | select(.name == "Review")] | length' <<<"$status_json")"
          testing_count="$(jq '[.options[] | select(.name == "Testing")] | length' <<<"$status_json")"

          echo "Before: $before"

          if [ "$review_count" -eq 1 ] && [ "$testing_count" -eq 0 ]; then
            echo "Project already uses Review; no schema change needed."
            exit 0
          fi

          if [ "$review_count" -ne 0 ] || [ "$testing_count" -ne 1 ]; then
            echo "Expected exactly one Testing option and no Review option; refusing ambiguous schema mutation." >&2
            exit 1
          fi

          options_json="$(jq -c '[.options[] | {id, name, color, description} | if .name == "Testing" then .name = "Review" else . end]' <<<"$status_json")"
          mutation='mutation($fieldId: ID!, $options: [ProjectV2SingleSelectFieldOptionInput!]!) { updateProjectV2Field(input: {fieldId: $fieldId, singleSelectOptions: $options}) { projectV2Field { ... on ProjectV2SingleSelectField { id name options { id name color description } } } } }'
          payload="$(jq -n --arg query "$mutation" --arg fieldId "$field_id" --argjson options "$options_json" '{query:$query, variables:{fieldId:$fieldId, options:$options}}')"

          result="$(gh api graphql --input - <<<"$payload")"
          after="$(jq -r '[.data.updateProjectV2Field.projectV2Field.options[].name] | join(" / ")' <<<"$result")"

          echo "After: $after"
          {
            echo '## Project Status schema reconciliation'
            echo "- Before: $before"
            echo "- After: $after"
            echo '- Existing option IDs were supplied to preserve item field values.'
          } >> "$GITHUB_STEP_SUMMARY"
