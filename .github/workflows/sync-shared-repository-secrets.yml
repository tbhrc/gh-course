name: Sync shared repository secrets

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  sync:
    if: >-
      github.actor == 'tbhrc' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[sync-shared-secrets]'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preflight source secrets
        id: preflight
        env:
          AGENT_DISPATCH_TOKEN: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${AGENT_DISPATCH_TOKEN:-}" ]; then
            echo "Missing source secret: AGENT_DISPATCH_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi
          if [ -z "${PROJECT_MANAGEMENT_TOKEN:-}" ]; then
            echo "Missing source secret: PROJECT_MANAGEMENT_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Source secret preflight passed for both canonical names. Values were not exposed." >> "$GITHUB_STEP_SUMMARY"

      - name: Discover visible repositories and sync secrets
        id: sync
        env:
          GH_TOKEN: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          AGENT_DISPATCH_TOKEN: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          owner="tbhrc"

          # These core repositories are explicit completeness sentinels. They are
          # first-party operating repositories that must never disappear silently
          # from token-scoped discovery. Dynamic discovery still expands coverage
          # to every other visible active non-fork repository.
          required_repos=(
            "tbhrc/github-course"
            "tbhrc/skills"
            "tbhrc/tb"
            "tbhrc/ai-ops"
            "tbhrc/now-hiring"
            "tbhrc/recruitment"
            "tbhrc/assessments"
            "tbhrc/drf"
            "tbhrc/implementai.ae"
            "tbhrc/agentic-engine"
            "tbhrc/new"
          )

          mapfile -t discovered_repos < <(
            gh repo list "$owner" --limit 500 \
              --json nameWithOwner,isArchived,isFork \
              --jq '.[] | select(.isArchived == false and .isFork == false) | .nameWithOwner' \
              | sort -u
          )

          if [ "${#discovered_repos[@]}" -eq 0 ]; then
            echo "No active non-fork repositories were visible to the bridge credential." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          printf 'Bridge credential discovered %s active non-fork repositories.\n' "${#discovered_repos[@]}" >> "$GITHUB_STEP_SUMMARY"

          # Fail before mutation if a core repository is hidden from the credential.
          for required in "${required_repos[@]}"; do
            if ! printf '%s\n' "${discovered_repos[@]}" | grep -Fxq "$required"; then
              echo "Required core repository is not visible to AGENT_DISPATCH_TOKEN: $required" >> "$GITHUB_STEP_SUMMARY"
              echo "The bridge will not claim complete coverage. Expand token repository access or move to organisation-level secrets (tbhrc/ai-ops#7)." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

          failures=0
          successes=0

          for repo in "${discovered_repos[@]}"; do
            echo "Syncing canonical shared secrets to $repo" >> "$GITHUB_STEP_SUMMARY"

            if printf '%s' "$AGENT_DISPATCH_TOKEN" | gh secret set AGENT_DISPATCH_TOKEN --repo "$repo" >/dev/null 2>&1; then
              agent_ok=1
            else
              agent_ok=0
            fi

            if printf '%s' "$PROJECT_MANAGEMENT_TOKEN" | gh secret set PROJECT_MANAGEMENT_TOKEN --repo "$repo" >/dev/null 2>&1; then
              project_ok=1
            else
              project_ok=0
            fi

            if [ "$agent_ok" -eq 1 ] && [ "$project_ok" -eq 1 ]; then
              echo "- $repo: success" >> "$GITHUB_STEP_SUMMARY"
              successes=$((successes + 1))
            else
              echo "- $repo: FAILED (agent_secret=$agent_ok project_secret=$project_ok)" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
          done

          echo "successes=$successes" >> "$GITHUB_OUTPUT"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

          if [ "$failures" -ne 0 ]; then
            echo "$failures visible repositories could not be updated. This normally indicates repository-admin or token-scope limitations." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All repositories visible to the bridge credential were updated, and every explicit core repository was present in discovery." >> "$GITHUB_STEP_SUMMARY"
          echo "This is not treated as proof of account-wide completeness beyond the credential's visibility; organisation-level migration remains tracked in tbhrc/ai-ops#7." >> "$GITHUB_STEP_SUMMARY"

      - name: Record Issue-trigger result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            body="Shared-secret bridge completed successfully for every active non-fork repository visible to the bridge credential, and all explicit core repositories passed the completeness sentinel. Secret values were not exposed. This repository-level bridge is temporary; long-term organisation-level migration is tracked in tbhrc/ai-ops#7."
          else
            body="Shared-secret bridge did not complete successfully. Review this workflow run for repository-level success/failure names only; secret values are never printed. A hidden core repository, permission boundary or target write failure must be resolved under #151. Organisation-level replacement remains tracked in tbhrc/ai-ops#7."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
