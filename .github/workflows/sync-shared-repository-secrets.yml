name: Sync shared repository secrets

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  sync:
    if: >-
      github.actor == 'tbhrc' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[sync-shared-secrets]'))
    runs-on: ubuntu-latest

    steps:
      - name: Preflight source secrets
        id: preflight
        env:
          AGENT_DISPATCH_TOKEN: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${AGENT_DISPATCH_TOKEN:-}" ]; then
            echo "Missing source secret: AGENT_DISPATCH_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi
          if [ -z "${PROJECT_MANAGEMENT_TOKEN:-}" ]; then
            echo "Missing source secret: PROJECT_MANAGEMENT_TOKEN" >> "$GITHUB_STEP_SUMMARY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Source secret preflight passed for both canonical names. Values were not exposed." >> "$GITHUB_STEP_SUMMARY"

      - name: Discover active repositories and sync secrets
        id: sync
        env:
          GH_TOKEN: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          AGENT_DISPATCH_TOKEN: ${{ secrets.AGENT_DISPATCH_TOKEN }}
          PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          owner="tbhrc"
          mapfile -t repos < <(
            gh repo list "$owner" --limit 500 \
              --json nameWithOwner,isArchived,isFork \
              --jq '.[] | select(.isArchived == false and .isFork == false) | .nameWithOwner' \
              | sort
          )

          if [ "${#repos[@]}" -eq 0 ]; then
            echo "No active non-fork repositories were discovered for $owner." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          printf 'Discovered %s active non-fork repositories.\n' "${#repos[@]}" >> "$GITHUB_STEP_SUMMARY"

          failures=0
          successes=0

          for repo in "${repos[@]}"; do
            echo "Syncing canonical shared secrets to $repo" >> "$GITHUB_STEP_SUMMARY"

            if printf '%s' "$AGENT_DISPATCH_TOKEN" | gh secret set AGENT_DISPATCH_TOKEN --repo "$repo" --body - >/dev/null 2>&1; then
              agent_ok=1
            else
              agent_ok=0
            fi

            if printf '%s' "$PROJECT_MANAGEMENT_TOKEN" | gh secret set PROJECT_MANAGEMENT_TOKEN --repo "$repo" --body - >/dev/null 2>&1; then
              project_ok=1
            else
              project_ok=0
            fi

            if [ "$agent_ok" -eq 1 ] && [ "$project_ok" -eq 1 ]; then
              echo "- $repo: success" >> "$GITHUB_STEP_SUMMARY"
              successes=$((successes + 1))
            else
              echo "- $repo: FAILED (agent_secret=$agent_ok project_secret=$project_ok)" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
          done

          echo "successes=$successes" >> "$GITHUB_OUTPUT"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

          if [ "$failures" -ne 0 ]; then
            echo "$failures repositories could not be updated. This normally indicates repository-admin or token-scope limitations." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Record Issue-trigger result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            body="Shared-secret bridge completed successfully. Both canonical secret names were synced to all discovered active non-fork repositories. Secret values were not exposed. This repository-level bridge is temporary; long-term organisation-level migration is tracked in tbhrc/ai-ops#7."
          else
            body="Shared-secret bridge did not complete successfully. Review this workflow run for repository-level success/failure names only; secret values are never printed. Preserve the exact permission/configuration boundary and continue under #151. Organisation-level replacement remains tracked in tbhrc/ai-ops#7."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
