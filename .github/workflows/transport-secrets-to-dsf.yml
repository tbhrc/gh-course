name: One-time transport Actions secrets to DSF

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/transport-secrets-to-dsf.yml'

permissions:
  contents: read

jobs:
  transport:
    if: github.actor == 'tbhrc'
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: tbhrc/dsf
      SRC_AGENT_DISPATCH_TOKEN: ${{ secrets.AGENT_DISPATCH_TOKEN }}
      SRC_PROJECT_MANAGEMENT_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_TOKEN }}
      SRC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Preflight source secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SRC_AGENT_DISPATCH_TOKEN:-}" ] || missing+=(AGENT_DISPATCH_TOKEN)
          [ -n "${SRC_PROJECT_MANAGEMENT_TOKEN:-}" ] || missing+=(PROJECT_MANAGEMENT_TOKEN)
          [ -n "${SRC_GEMINI_API_KEY:-}" ] || missing+=(GEMINI_API_KEY)
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing source secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo 'All three source secret names are populated.' >> "$GITHUB_STEP_SUMMARY"

      - name: Transport secrets directly into DSF
        shell: bash
        run: |
          set -euo pipefail
          set +x

          set_secret() {
            local name="$1"
            local value="$2"
            local auth

            for auth in "$SRC_AGENT_DISPATCH_TOKEN" "$SRC_PROJECT_MANAGEMENT_TOKEN"; do
              if printf '%s' "$value" | GH_TOKEN="$auth" gh secret set "$name" --repo "$TARGET_REPO" >/dev/null 2>&1; then
                printf 'transported %s\n' "$name" >> "$GITHUB_STEP_SUMMARY"
                return 0
              fi
            done

            printf 'Unable to write target secret %s with available credentials.\n' "$name" >&2
            return 1
          }

          set_secret AGENT_DISPATCH_TOKEN "$SRC_AGENT_DISPATCH_TOKEN"
          set_secret PROJECT_MANAGEMENT_TOKEN "$SRC_PROJECT_MANAGEMENT_TOKEN"
          set_secret GEMINI_API_KEY "$SRC_GEMINI_API_KEY"

      - name: Verify target secret names only
        shell: bash
        run: |
          set -euo pipefail
          set +x

          names=''
          for auth in "$SRC_AGENT_DISPATCH_TOKEN" "$SRC_PROJECT_MANAGEMENT_TOKEN"; do
            if names="$(GH_TOKEN="$auth" gh secret list --repo "$TARGET_REPO" --json name --jq '.[].name' 2>/dev/null)"; then
              break
            fi
          done

          if [ -z "$names" ]; then
            echo 'Unable to list target secret metadata for verification.' >&2
            exit 1
          fi

          for required in AGENT_DISPATCH_TOKEN PROJECT_MANAGEMENT_TOKEN GEMINI_API_KEY; do
            if ! grep -Fxq "$required" <<< "$names"; then
              printf 'Target secret metadata missing: %s\n' "$required" >&2
              exit 1
            fi
          done

          {
            echo '### DSF secret transport verified'
            echo '- AGENT_DISPATCH_TOKEN: present'
            echo '- PROJECT_MANAGEMENT_TOKEN: present'
            echo '- GEMINI_API_KEY: present'
            echo '- Secret values were not printed or persisted.'
          } >> "$GITHUB_STEP_SUMMARY"
