name: Validate Public CMS

on:
  pull_request:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'wiki/Home.md'
      - 'students/david/progress.md'
      - 'knowledge-base/executor-benchmark-framework.md'
      - 'scripts/build_public_state.py'
      - 'site/index.template.html'
      - 'site/cms.js'
      - 'site/public-state.json'
      - 'index.html'
      - '.github/workflows/generate-public-site.yml'
      - '.github/workflows/validate-public-cms.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build state from canonical sources
        run: |
          set -euo pipefail
          python3 scripts/build_public_state.py
          python3 -m json.tool site/public-state.json > /dev/null
          test -s site/index.template.html
          test -s site/cms.js

      - name: Validate required CMS fields
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('site/public-state.json').read_text())
          assert state['course']['version']
          assert state['student']['course_stage'] != 'Not recorded'
          assert state['student']['current_focus'] != 'Not recorded'
          assert state['student']['next_objective'] != 'Not recorded'
          assert isinstance(state['benchmark']['review_ready_scoreboard'], list)
          assert state['benchmark']['canonical_url']
          print('CMS contract valid')
          PY
